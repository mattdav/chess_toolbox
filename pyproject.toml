[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "chess_toolbox"
authors = [
  {name = "Matthieu Daviaud", email = "matthieu.daviaud@gmail.com"},
]
version = "0.1.0"
description = "Bibliothèque d'outils pour manipuler gérer mes bases Chessbase"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "beautifulsoup4>=4.13.0",
    "pydantic-settings>=2.6.0",
    "python-chess>=1.999",
    "python-dotenv>=1.1.0",
    "selenium>=4.31.0",
    "setuptools>=82.0.1",
    "curl-cffi>=0.7.0",
]

[project.scripts]
chess_toolbox = "chess_toolbox.__main__:main"

[project.optional-dependencies]
dev = [
    "commitizen>=4.18.0",
    "invoke>=3.0.3",
    "okflint>=0.3.1",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=2.0.0",
]
lint = [
    "mypy>=1.20.0",
    "ruff>=0.15.10",
    "types-beautifulsoup4>=4.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "src/chess_toolbox"]
addopts = [
    "--doctest-modules",
    "--cov=src/chess_toolbox",
    "--cov-report=term-missing",
    "--cov-report=html",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/chess_toolbox"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
skip_empty = true

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["selenium.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["curl_cffi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "chess_toolbox.bin.chessable_to_pgn.Utilities",
    "chess_toolbox.bin.chessable_to_pgn.Pgn",
    "chess_toolbox.bin.chessable_to_pgn.CommandLine",
    "chess_toolbox.bin.chessable_to_pgn.core",
    "chess_toolbox.bin.chessable_to_pgn.WebFetch",
    "chess_toolbox.bin.split_pgn.core",
]
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["src/chess_toolbox"]

[tool.hatch.build.targets.wheel.force-include]
"src/chess_toolbox/py.typed" = "chess_toolbox/py.typed"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:^version",
    "src/chess_toolbox/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
